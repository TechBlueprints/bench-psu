[project]
name = "bench-psu"
version = "0.1.0"
description = "Headless control of a Kiprim DC620S bench power supply: driver, daemon with HTTP API and MCP endpoint, CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # standard library only, so the host needs no extra package

[project.scripts]
kiprim = "kiprim.cli:main"
bench-psud = "kiprim.daemon:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiprim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
