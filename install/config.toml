# bench-psud configuration. The installer copies this to
# /etc/bench-psu/config.toml once and never overwrites local edits.
# Restart the service after a change: systemctl restart bench-psud
# (a restart never changes the supply's output).

[serial]
device = "/dev/kiprim"        # the udev symlink; never /dev/ttyUSB0
reply_timeout = 0.5           # seconds to wait for a query reply
setter_error_window = 0.15    # seconds to wait for a possible ERR after a setter
lost_after = 3                # consecutive timeouts before the link counts as lost
reconnect_interval = 2.0      # seconds between reopen attempts

[poll]
interval = 0.25               # seconds between measurement polls (4 Hz)
setpoint_interval = 5.0       # seconds between full setpoint/limit refreshes

[http]
listen = "0.0.0.0"
port = 8100
token_file = "/etc/bench-psu/token"   # generated by the installer; writes need it
# Optional: also restrict writes to these networks (empty = any address with the token)
write_allow_from = []
mcp = true                    # MCP endpoint at /mcp (read tools open, write tools need the token)

[limits]
# Host-side ceilings, enforced before anything is sent. The supply can do
# 60 V / 20 A; these defaults suit 12 V work (a 4S LiFePO4 or AGM ceiling is
# 14.6-14.7 V). Raise them deliberately.
max_voltage = 15.0
max_current = 10.0

[behaviour]
# Switch the output off when the daemon stops. Default false: a bench supply
# should not drop its load because a service restarted.
output_off_on_exit = false
